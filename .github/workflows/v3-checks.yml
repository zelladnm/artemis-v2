name: Artemis v3 checks

on:
  push:
    branches: [main, 'feat/artemis-v3-*']
    paths: ['artemis_v3/**', 'tests/**', 'docs/v3/**', '.github/workflows/v3-checks.yml', '.gitattributes']
  pull_request:
    paths: ['artemis_v3/**', 'tests/**', 'docs/v3/**', '.github/workflows/v3-checks.yml', '.gitattributes']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile v3 source
        run: python -m compileall -q artemis_v3
      - name: Run v3 offline tests
        run: python -m unittest discover -s tests -p 'test_v3*.py' -v
      - name: Prepare a synthetic draft and preflight annotated suites without a model
        run: |
          python -m artemis_v3.evaluation prepare --report tests/fixtures/semantic_eval/history_current.json --ruleset tests/fixtures/semantic_eval/rules.json --historical-report tests/fixtures/semantic_eval/history_prior.json --case-id ci_preparation --synthetic --output-dir "$RUNNER_TEMP/artemis-eval-preparation"
          python -m artemis_v3.evaluation check --suite tests/fixtures/semantic_eval/suite.json > "$RUNNER_TEMP/artemis-eval-preparation/single-preflight.json"
          python -m artemis_v3.evaluation check --suite tests/fixtures/semantic_eval/historical_suite.json > "$RUNNER_TEMP/artemis-eval-preparation/historical-preflight.json"
      - name: Run single and historical source evaluation with empty human-review summaries
        run: |
          python -m artemis_v3.evaluation run --suite tests/fixtures/semantic_eval/suite.json --replay tests/fixtures/semantic_eval/replay.json --output-dir "$RUNNER_TEMP/artemis-semantic-eval"
          python -m artemis_v3.evaluation review --run "$RUNNER_TEMP/artemis-semantic-eval/run.json" --ratings "$RUNNER_TEMP/artemis-semantic-eval/review.json"
          python -m artemis_v3.evaluation run --suite tests/fixtures/semantic_eval/historical_suite.json --replay tests/fixtures/semantic_eval/historical_replay.json --output-dir "$RUNNER_TEMP/artemis-historical-eval"
          python -m artemis_v3.evaluation review --run "$RUNNER_TEMP/artemis-historical-eval/run.json" --ratings "$RUNNER_TEMP/artemis-historical-eval/review.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artemis-semantic-evaluation
          path: |
            ${{ runner.temp }}/artemis-semantic-eval/*.json
            ${{ runner.temp }}/artemis-historical-eval/*.json
            ${{ runner.temp }}/artemis-eval-preparation/**
          retention-days: 7
          if-no-files-found: ignore

  workbench-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling (not a runtime dependency)
        run: npm install --prefix "$RUNNER_TEMP/artemis-ui" --no-save playwright@1.56.1
      - name: Install Chromium for browser checks
        run: node "$RUNNER_TEMP/artemis-ui/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Run workbench browser flow
        env:
          ARTEMIS_PLAYWRIGHT_PATH: ${{ runner.temp }}/artemis-ui/node_modules/playwright
          ARTEMIS_UI_ARTIFACTS: ${{ runner.temp }}/artemis-ui-artifacts
        run: node tests/workbench_browser.cjs
      - name: Run semantic browser flow with synthetic Ollama fixture
        env:
          ARTEMIS_PLAYWRIGHT_PATH: ${{ runner.temp }}/artemis-ui/node_modules/playwright
          ARTEMIS_UI_ARTIFACTS: ${{ runner.temp }}/artemis-ui-artifacts/semantic
          ARTEMIS_BROWSER_SEMANTIC: '1'
        run: node tests/workbench_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-screenshots
          path: ${{ runner.temp }}/artemis-ui-artifacts
          retention-days: 7
          if-no-files-found: ignore
